apiVersion: v1
kind: Service
metadata:
  name: kp-generator-agent
  namespace: ucode-prod          # adjust to your namespace
  labels:
    app: kp-generator-agent
spec:
  # Internal only. The gateway reaches it at
  #   http://kp-generator-agent.<namespace>.svc:8787
  # Do NOT expose this via a public Ingress.
  type: ClusterIP
  selector:
    app: kp-generator-agent
  ports:
    - name: http
      port: 8787
      targetPort: http
