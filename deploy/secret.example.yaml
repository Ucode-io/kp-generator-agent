# Template only — DO NOT commit a real key. Create the secret out-of-band, e.g.:
#   kubectl -n ucode-prod create secret generic kp-generator-agent \
#     --from-literal=KP_AGENT_API_KEY="$(openssl rand -hex 32)"
# Or source it from Vault / sealed-secrets. The SAME value must be set on the
# gateway as KP_AGENT_URL's companion env KP_AGENT_API_KEY (server-side only).
apiVersion: v1
kind: Secret
metadata:
  name: kp-generator-agent
  namespace: ucode-prod
type: Opaque
stringData:
  KP_AGENT_API_KEY: "replace-with-a-strong-random-value"
