apiVersion: apps/v1
kind: Deployment
metadata:
  name: kp-generator-agent
  namespace: ucode-prod          # adjust to your namespace
  labels:
    app: kp-generator-agent
spec:
  # 2 replicas => 2 concurrent generations (each pod processes one KP at a time,
  # see server.mjs in-process queue). Scale to 3 if concurrent load grows.
  replicas: 2
  selector:
    matchLabels:
      app: kp-generator-agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: kp-generator-agent
    spec:
      containers:
        - name: kp-generator-agent
          image: gitlab.udevs.io:5050/ucode/kp-generator-agent:latest   # set your built image
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            # Server binds 0.0.0.0 (also set in the image). Bearer key comes from a secret.
            - name: KP_AGENT_HOST
              value: "0.0.0.0"
            - name: KP_AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: kp-generator-agent
                  key: KP_AGENT_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
      imagePullSecrets:
        - name: gitlab-registry     # adjust to your registry pull secret
